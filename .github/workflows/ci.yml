name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - name: Prove science execution lock
        shell: bash
        run: |
          tmp=$(mktemp -d)
          printf '%s\n' '{"case_id":"ci","fixture_class":"synthetic","operator":"noop","files":[]}' > "$tmp/m.json"
          if bids-srb execute "$tmp/m.json"; then
            echo "execute unexpectedly succeeded" >&2
            exit 1
          fi
